name: MAREC Grok Marketing Agent Cron

on:
  schedule:
    # 5:17 AM PDT (12:17 UTC)
    - cron: '17 12 * * *'
    # 5:23 PM PDT (00:23 UTC next day)
    - cron: '23 0 * * *'
    # 11:17 PM PDT (06:17 UTC next day) - Tonight's test run!
    - cron: '17 6 * * *'
  workflow_dispatch: # Enables manual trigger from Actions tab
  repository_dispatch: # Enables instant external triggers (Cron-Job.org / API)
    types: [run-marketing-pipeline]

jobs:
  run-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Execute Marketing Pipeline
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
        run: python main.py

      - name: Commit & Push Updated Database
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add database/leads.db 2>/dev/null || true
          git commit -m "Auto-update leads.db after agent execution [skip ci]" || echo "No database changes to commit."
          git push || echo "Git push skipped or no upstream changes."