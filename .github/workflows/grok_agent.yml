name: MAREC Grok Marketing Agent Cron

on:
  schedule:
    # Runs 3 times a day at 5:00 AM, 5:00 PM, and 11:00 PM PDT (12:00, 00:00, 06:00 UTC)
    - cron: '0 12,0,6 * * *'
  repository_dispatch:
    types: [run-grok-agent]
  workflow_dispatch:

jobs:
  run-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Discover Real Prospect Emails
        env:
          HUNTER_API_KEY: ${{ secrets.HUNTER_API_KEY }}
        run: |
          if [ -f core/enrich_leads.py ]; then
            python core/enrich_leads.py
          else
            echo "core/enrich_leads.py not found, skipping lead enrichment."
          fi

      - name: Run Grok Marketing Pipeline
        env:
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
        run: python main.py

      - name: Commit and Push Updated Leads Database
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add database/leads.db
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update processed leads database" && git push)