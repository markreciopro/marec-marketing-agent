name: MAREC Grok Marketing Agent Cron

on:
  schedule:
    # 5:00 AM PST (13:00 UTC)
    - cron: '0 13 * * *'
    # 5:00 PM PST (01:00 UTC next day)
    - cron: '0 1 * * *'
    # 6:00 PM PST (02:00 UTC next day)
    - cron: '0 2 * * *'
  workflow_dispatch: # Allows manual trigger anytime from the GitHub Actions tab

jobs:
  run-agent:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history so git push works seamlessly

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Execute Marketing Agent
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          APOLLO_API_KEY: ${{ secrets.APOLLO_API_KEY }}
          HUNTER_API_KEY: ${{ secrets.HUNTER_API_KEY }}
        run: python main.py

      - name: Commit & Push Database Updates (Prevent Duplicates)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add database/leads.db
          git commit -m "Auto-update leads.db after agent run [skip ci]" || echo "No database changes to commit."
          git push